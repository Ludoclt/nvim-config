# OpenOCD configuration, read by `openocd -f openocd.cfg` (<leader>mo starts
# the GDB server, <leader>mf flashes). Pick one probe and one target.
# Available files: /usr/share/openocd/scripts/{interface,target,board}/

# STM32 board with an ST-Link (Nucleo, Discovery, Blue Pill + clone)
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

# Raspberry Pi Pico (RP2040) with a Debug Probe (CMSIS-DAP)
# source [find interface/cmsis-dap.cfg]
# adapter speed 5000
# source [find target/rp2040.cfg]

# ESP32-C3 / ESP32-S3 USB-JTAG: needs Espressif's OpenOCD (ESP-IDF)
# source [find board/esp32c3-builtin.cfg]
