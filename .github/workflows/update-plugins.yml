name: Update plugins

# Weekly: update every plugin, run the smoke test on the result, and open (or
# refresh) a pull request with the new lazy-lock.json. Nothing reaches main
# until the pull request is merged by hand.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-plugins
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: deps/plugin-update
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-neovim

      - name: Update plugins and run the smoke test
        id: smoke
        run: |
          set +e
          scripts/smoke-test.sh --update 2>&1 | tee smoke.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        id: pr
        run: |
          if git diff --quiet -- lazy-lock.json; then
            echo "No plugin updates this week."
            exit 0
          fi

          {
            echo "Weekly plugin update, generated by the \`Update plugins\` workflow."
            echo
            if [[ "${{ steps.smoke.outputs.status }}" == 0 ]]; then
              echo "**Smoke test: passed** on this exact lockfile."
            else
              echo "**Smoke test: FAILED.** Do not merge as is: see the log below."
            fi
            echo
            echo "### Updated plugins"
            git diff -U0 -- lazy-lock.json | grep -oE '^\+  "[^"]+"' | sed -E 's/^\+  "(.*)"/- \1/'
            if git diff -U0 -- lazy-lock.json | grep -q '^+  "LazyVim"'; then
              echo
              echo "LazyVim itself is updated: read its changelog (\`<leader>L\` in Neovim) before merging."
            fi
            echo
            echo "### Smoke test log"
            echo '```'
            grep -vE '^\S*\[[0-9;]*m\[|nvim-treesitter/install' smoke.log | tail -n 60
            echo '```'
            echo
            echo "After merging, run \`scripts/sync.sh\` on each machine."
            echo
            echo "(Pull requests opened by this workflow do not trigger CI: the smoke test above is the check.)"
          } > body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add lazy-lock.json
          git commit -m "build(deps): update plugins"
          git push --force origin "$BRANCH"

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --body-file body.md
          else
            gh pr create --base main --head "$BRANCH" --title "build(deps): update plugins" --body-file body.md
          fi

      - name: Fail the run when the smoke test failed
        if: steps.smoke.outputs.status != '0'
        run: exit 1
